<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RawDeck</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="style.css">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('PWA registration missed: ', err));
    });
  }
</script>
</head>
<body>

<div id="app-container">

  <!-- ============================================================
       LOADING STATUS
       ============================================================ -->
  <div id="load-status"><span class="spinner"></span> Loading stations…</div>

  <!-- ============================================================
       PLAYER WINDOW
       ============================================================ -->
  <div id="player-window" class="winamp-window">
    <div class="winamp-title">
      <span class="icon">⚡</span>
      <span class="title-text">RawDeck v2.0</span>
      <span class="title-btns">
        <button id="btn-minimize" title="Minimize to playlist">_</button>
        <button id="btn-close" title="Close">✕</button>
      </span>
    </div>
    <div class="winamp-body">

      <!-- Display panel -->
      <div class="display-panel">
        <div class="display-row">
          <div class="track-marquee" id="track-marquee">
            <span class="marquee-inner" id="marquee-text">RawDeck — Radio Stream Player — Click Play to start</span>
          </div>
          <div class="time-display" id="time-display" title="Click to toggle elapsed / remaining">
            <span class="time-digit" id="t-min1">0</span>
            <span class="time-digit" id="t-min2">0</span>
            <span class="time-digit sep">:</span>
            <span class="time-digit" id="t-sec1">0</span>
            <span class="time-digit" id="t-sec2">0</span>
          </div>
        </div>
        <div class="status-row">
          <span class="status-left">
            <span id="status-stereo" class="active">STEREO</span>
            <span id="status-bitrate">— kbps</span>
          </span>
          <span class="status-right">
            <span id="status-samplerate">— kHz</span>
          </span>
        </div>
        <canvas id="spectrum-canvas" width="556" height="44"></canvas>
      </div>

      <!-- Control buttons -->
      <div class="controls-row">
        <button class="ctrl-btn" id="btn-prev" title="Previous station / track">◄◄</button>
        <button class="ctrl-btn play-btn" id="btn-play" title="Play">►</button>
        <button class="ctrl-btn" id="btn-pause" title="Pause" disabled>❚❚</button>
        <button class="ctrl-btn" id="btn-stop" title="Stop">■</button>
        <button class="ctrl-btn" id="btn-next" title="Next station / track">►►</button>
        <button class="ctrl-btn eject-btn" id="btn-eject" title="Load local audio file">⏏</button>
      </div>

      <!-- Position slider -->
      <input type="range" class="pos-slider" id="pos-slider" min="0" max="1000" value="0">

      <!-- Volume slider -->
      <div class="slider-group">
        <span class="slider-label">VOL</span>
        <div class="slider-container">
          <input type="range" class="winamp-slider" id="vol-slider" min="0" max="100" value="75">
        </div>
      </div>

      <!-- Balance slider -->
      <div class="slider-group">
        <span class="slider-label">BAL</span>
        <div class="slider-container">
          <input type="range" class="winamp-slider" id="bal-slider" min="0" max="100" value="50">
        </div>
      </div>

      <!-- Bottom row -->
      <div class="bottom-row">
        <div class="left-btns">
          <button class="small-btn" id="btn-shuffle" title="Shuffle">SHUF</button>
          <button class="small-btn" id="btn-repeat" title="Repeat">REP</button>
          <button class="small-btn" id="btn-fav" title="Toggle Favorite">FAV</button>
        </div>
        <div class="right-btns">
          <button class="small-btn" id="btn-toggle-eq" title="Toggle Equalizer">EQ</button>
          <button class="small-btn active" id="btn-toggle-pl" title="Toggle Playlist">PL</button>
          <button class="small-btn add-url-btn" id="btn-add-url" title="Add custom stream URL">+URL</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       EQUALIZER WINDOW
       ============================================================ -->
  <div id="eq-window" class="winamp-window">
    <div class="winamp-title">
      <span class="icon">⚡</span>
      <span class="title-text">Equalizer</span>
      <span class="title-btns">
        <button id="btn-eq-close" title="Close EQ">✕</button>
      </span>
    </div>
    <div class="eq-body">
      <div class="eq-actions">
        <button class="small-btn active" id="btn-eq-on">ON</button>
        <button class="small-btn" id="btn-eq-auto">AUTO</button>
        <button class="small-btn" id="btn-eq-presets">PRESETS</button>
        <button class="small-btn" id="btn-eq-reset">FLAT</button>
        <span style="flex:1"></span>
        <span id="eq-prealbum" style="font-size:8px;color:#666;">Preamp</span>
      </div>
      <div class="eq-controls" id="eq-controls">
        <!-- Preamp -->
        <div class="eq-band preamp">
          <div class="eq-value" id="eq-val-pre">0</div>
          <input type="range" class="eq-slider" id="eq-pre" min="-12" max="12" value="0" step="1">
          <div class="eq-label">PREAMP</div>
        </div>
        <!-- 10 frequency bands -->
        <div class="eq-band"><div class="eq-value" id="eq-val-0">0</div><input type="range" class="eq-slider" id="eq-0" min="-12" max="12" value="0" step="1"><div class="eq-label">31Hz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-1">0</div><input type="range" class="eq-slider" id="eq-1" min="-12" max="12" value="0" step="1"><div class="eq-label">62Hz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-2">0</div><input type="range" class="eq-slider" id="eq-2" min="-12" max="12" value="0" step="1"><div class="eq-label">125Hz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-3">0</div><input type="range" class="eq-slider" id="eq-3" min="-12" max="12" value="0" step="1"><div class="eq-label">250Hz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-4">0</div><input type="range" class="eq-slider" id="eq-4" min="-12" max="12" value="0" step="1"><div class="eq-label">500Hz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-5">0</div><input type="range" class="eq-slider" id="eq-5" min="-12" max="12" value="0" step="1"><div class="eq-label">1KHz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-6">0</div><input type="range" class="eq-slider" id="eq-6" min="-12" max="12" value="0" step="1"><div class="eq-label">2KHz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-7">0</div><input type="range" class="eq-slider" id="eq-7" min="-12" max="12" value="0" step="1"><div class="eq-label">4KHz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-8">0</div><input type="range" class="eq-slider" id="eq-8" min="-12" max="12" value="0" step="1"><div class="eq-label">8KHz</div></div>
        <div class="eq-band"><div class="eq-value" id="eq-val-9">0</div><input type="range" class="eq-slider" id="eq-9" min="-12" max="12" value="0" step="1"><div class="eq-label">16KHz</div></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       PLAYLIST WINDOW
       ============================================================ -->
  <div id="playlist-window" class="winamp-window">
    <div class="winamp-title">
      <span class="icon">⚡</span>
      <span class="title-text">Playlist Editor</span>
      <span class="title-btns">
        <button id="btn-pl-close" title="Close Playlist">✕</button>
      </span>
    </div>
    <div class="playlist-body">
      <div class="filter-bar">
        <input type="text" class="search-input" id="search-input" placeholder="Search stations…">
        <select id="genre-select"><option value="">All Genres</option></select>
        <select id="source-select"><option value="">All Sources</option></select>
        <button class="filter-btn" id="btn-clear-filter">✕</button>
      </div>
      <div id="station-list"></div>
      <div class="playlist-status">
        <span id="pl-count" class="count">0 stations</span>
        <span id="pl-info"></span>
      </div>
    </div>
  </div>

  <!-- ============================================================
       DIALOG: Custom URL
       ============================================================ -->
  <div class="dialog-overlay" id="url-dialog">
    <div class="dialog-box">
      <h3>Add Custom Stream</h3>
      <label for="url-input">Stream URL:</label>
      <input type="url" id="url-input" placeholder="https://example.com/stream.mp3">
      <label for="url-name">Station Name (optional):</label>
      <input type="text" id="url-name" placeholder="My Radio">
      <label for="url-genre">Genre (optional):</label>
      <input type="text" id="url-genre" placeholder="e.g. Rock, Jazz, Talk">
      <label for="url-country">Country (optional):</label>
      <input type="text" id="url-country" placeholder="e.g. US, UK, DE">
      <div class="dialog-actions">
        <button id="btn-url-cancel">Cancel</button>
        <button class="primary" id="btn-url-add">Add & Play</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" accept="audio/*,.mp3,.flac,.ogg,.wav,.m4a" multiple style="display:none">

</div><!-- /app-container -->

<script src="app.js"></script>
</body>
</html>
